<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#f6efe2;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#3a2e22;}
.page{position:relative;width:390px;height:844px;padding:0 20px;box-sizing:border-box;}
.statusbar{height:28px;}
.header{padding:16px 0 8px;}
.greeting{font-size:24px;font-weight:700;}
.subtitle{font-size:13px;color:#8a7a63;margin-top:3px;}
.avatar{position:absolute;top:18px;right:0;width:38px;height:38px;border-radius:50%;background:#fff;
  border:1.5px solid #3a2e22;display:flex;align-items:center;justify-content:center;font-size:15px;}
.hero{margin-top:24px;background:#fffaf0;border:1.5px solid #6b2b2b;border-radius:6px;padding:18px;position:relative;}
.hero-title{font-size:22px;font-weight:700;}
.hero-sub{font-size:13px;color:#8a7a63;margin-top:4px;}
.stampline{display:flex;gap:10px;margin-top:16px;}
.stamp{width:48px;height:48px;border-radius:50%;border:2px solid #6b2b2b;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:700;color:#6b2b2b;text-align:center;transform:rotate(-6deg);}
.stamp.filled{background:#6b2b2b;color:#fffaf0;}
.stamp.empty{border-style:dashed;color:#c7b89a;border-color:#c7b89a;transform:rotate(4deg);}
.count{font-size:12px;color:#8a7a63;margin-top:10px;}
.section-head{font-size:16px;font-weight:700;margin-top:28px;}
.card2{margin-top:14px;background:#fffaf0;border:1px solid #e3d6bd;border-radius:6px;
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.card2-title{font-size:14px;font-weight:700;}
.card2-meta{font-size:11px;color:#8a7a63;margin-top:2px;}
.badge{width:26px;height:26px;border-radius:50%;border:1.5px dashed #c7b89a;color:#c7b89a;font-size:8px;
  display:flex;align-items:center;justify-content:center;}
.fab{position:absolute;right:20px;bottom:92px;width:56px;height:56px;border-radius:50%;background:#6b2b2b;
  color:#fffaf0;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25);}
.navbar{position:absolute;left:0;bottom:0;width:390px;height:72px;background:#fffaf0;border-top:1px solid #e3d6bd;
  display:flex;align-items:center;justify-content:space-around;}
.navitem{font-size:11px;color:#8a7a63;}
.navitem.active{color:#6b2b2b;font-weight:700;}
</style></head><body>
<div class="page">
  <div class="statusbar"></div>
  <div class="header"><div class="greeting">Hi, Traveler</div><div class="subtitle">Plan your next adventure</div>
    <div class="avatar">R</div></div>
  <div class="hero">
    <div class="hero-title">Tokyo Trip</div>
    <div class="hero-sub">Day-by-day itinerary &middot; 6 stops</div>
    <div class="stampline">
      <div class="stamp filled">DAY<br>1</div>
      <div class="stamp filled">SHIBU<br>YA</div>
      <div class="stamp empty">UENO</div>
      <div class="stamp empty">GINZA</div>
    </div>
    <div class="count">2 of 6 stops locked in</div>
  </div>
  <div class="section-head">Your Trips</div>
  <div class="card2"><div><div class="card2-title">Kyoto Weekend</div><div class="card2-meta">3 stops</div></div>
    <div class="badge">0/3</div></div>
  <div class="fab">+</div>
  <div class="navbar"><div class="navitem active">Home</div><div class="navitem">Trips</div>
    <div class="navitem">Budget</div><div class="navitem">Profile</div></div>
</div>
</body></html>
